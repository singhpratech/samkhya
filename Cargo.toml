[workspace]
resolver = "2"
members = [
    "samkhya-core",
    "samkhya-datafusion",
    "samkhya-duckdb",
    "samkhya-py",
    "samkhya-bench",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Prateek Singh <aiexplore369@gmail.com>"]
repository = "https://github.com/singhpratech/samkhya"
homepage = "https://github.com/singhpratech/samkhya"
readme = "README.md"
rust-version = "1.85"
description = "Portable cardinality correction for embedded analytical engines"
keywords = ["database", "cardinality", "query-optimizer", "datafusion", "duckdb"]
categories = ["database"]

[workspace.dependencies]
samkhya-core = { path = "samkhya-core", version = "0.0.1" }
# Foundational
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
thiserror = "1"
byteorder = "1.5"
# Hashing for sketches
twox-hash = "1.6"
# Persistence (feedback recorder)
rusqlite = { version = "0.31", features = ["bundled"] }
# Logging / errors
log = "0.4"
# CLI (bench)
clap = { version = "4", features = ["derive"] }
# Async (for DataFusion / future use)
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Test-only
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
