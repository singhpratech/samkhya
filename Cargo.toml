[workspace]
resolver = "2"
members = [
    "samkhya-core",
    "samkhya-datafusion",
    "samkhya-duckdb",
    "samkhya-duckdb-ext",
    "samkhya-py",
    "samkhya-polars",
    "samkhya-postgres",
    "samkhya-gpudb",
    "samkhya-iceberg",
    "samkhya-bench",
    "samkhya-cli",
    "samkhya-arrow",
    "samkhya-wasm",
    "samkhya-qdrant",
    "samkhya-it",
]

[workspace.package]
version = "1.2.3"
edition = "2024"
license = "Apache-2.0"
authors = ["Prateek Singh"]
repository = "https://github.com/singhpratech/samkhya"
homepage = "https://github.com/singhpratech/samkhya"
readme = "README.md"
rust-version = "1.85"
description = "A provable join-cardinality ceiling for analytical query engines, and the portable statistics that feed it"
keywords = ["database", "cardinality", "query-optimizer", "datafusion", "duckdb"]
categories = ["database"]

[workspace.dependencies]
samkhya-core = { path = "samkhya-core", version = "1.2.3" }
# Foundational
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
thiserror = "2"
byteorder = "1.5"
# Hashing for sketches
twox-hash = "1.6"
# Persistence (feedback recorder)
rusqlite = { version = "0.39", features = ["bundled"] }
# Logging / errors
log = "0.4"
# CLI (bench)
clap = { version = "4", features = ["derive"] }
# Async (for DataFusion / future use)
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Test-only
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
