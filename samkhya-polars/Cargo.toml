[package]
name = "samkhya-polars"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Polars integration for samkhya: build portable statistics sketches from Series"

[dependencies]
samkhya-core.workspace = true
# polars 0.54. The earlier 0.44 pin existed because polars-mem-engine 0.44's
# `dtype-decimal` graph pulled pyo3 0.21, which collided on `links = python`
# with samkhya-py's pyo3 0.29 under workspace feature unification. That
# collision no longer occurs at 0.54 — verified by building this crate with
# `--features engine` alongside the rest of the workspace.
#
# `dtype-decimal` stays off regardless: the sketcher has no decimal path, and
# enabling it drags in polars-sql, which the resolver cannot satisfy against
# the rest of this lock. Every other `dtype-*` sub-feature is enabled, giving
# full coverage of integer / boolean / temporal / array / struct /
# categorical / string columns.
polars = { version = "0.54", optional = true, default-features = false, features = [
    "lazy",
    "dtype-date",
    "dtype-datetime",
    "dtype-duration",
    "dtype-time",
    "dtype-array",
    "dtype-i8",
    "dtype-i16",
    "dtype-u8",
    "dtype-u16",
    "dtype-struct",
    "dtype-categorical",
] }

[features]
default = []
engine = ["dep:polars"]
