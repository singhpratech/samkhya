[package]
name = "samkhya-polars"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Polars integration for samkhya: build portable statistics sketches from Series"

[dependencies]
samkhya-core.workspace = true
# polars 0.44 is the highest minor that compiles under Rust 1.94 / edition 2024
# *and* coexists with this workspace's samkhya-py crate (pyo3 0.29). polars
# 0.43 / 0.42 / 0.41 fail to build because polars-core uses
# hashbrown::HashMap::raw_table_mut without enabling the corresponding
# `raw` feature on hashbrown 0.14 — see
# https://github.com/pola-rs/polars/issues — and the workspace cannot
# downgrade hashbrown without breaking DataFusion. The full `dtype-full`
# meta-feature also activates `dtype-decimal`, whose feature graph in
# polars-mem-engine 0.44 ends up pulling pyo3 0.21 (optional → required
# through workspace feature unification with samkhya-py's pyo3 0.29) and
# triggers a "links = python" collision. We therefore enable every
# `dtype-*` sub-feature except `dtype-decimal`, which gives the sketcher
# full coverage of integer / boolean / temporal / array / struct /
# categorical / string columns without poking the resolver.
polars = { version = "0.54", optional = true, default-features = false, features = [
    "lazy",
    "dtype-date",
    "dtype-datetime",
    "dtype-duration",
    "dtype-time",
    "dtype-array",
    "dtype-i8",
    "dtype-i16",
    "dtype-u8",
    "dtype-u16",
    "dtype-struct",
    "dtype-categorical",
] }

[features]
default = []
engine = ["dep:polars"]
