[package]
name = "samkhya-duckdb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "DuckDB client integration for samkhya's portable statistics"

[dependencies]
samkhya-core.workspace = true
duckdb = { version = "1.0", optional = true, features = ["bundled"] }

[features]
default = []
# Enable the embedded DuckDB Rust client (pulls in the `duckdb` crate with
# the `bundled` C++ build). Off by default so a plain
# `cargo check -p samkhya-duckdb` works without a C++ toolchain.
bundled = ["dep:duckdb"]
