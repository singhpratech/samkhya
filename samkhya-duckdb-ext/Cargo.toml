# =====================================================================
# samkhya-duckdb-ext
#
# v1.0 scaffold for the Rust <-> C++ FFI that bridges samkhya's portable
# cardinality primitives into DuckDB. This crate ships TWO halves:
#
#   1. A cxx::bridge surface (src/lib.rs) that exposes samkhya-core's
#      HllSketch and PuffinReader through a stable C++ namespace.
#   2. A C++ wrapper (src/wrapper.cc, src/wrapper.h) that re-exposes
#      those Rust symbols under a `samkhya::` namespace plus a
#      forward-declared `samkhya_register(DatabaseInstance &)` hook.
#
# What is intentionally NOT here yet: the DuckDB optimizer
# extension that consumes the FFI. That work waits on DuckDB Issue
# #11638, which tracks a stable C++ hook for plan-time cardinality
# overrides. Until the upstream API lands the cxx layer is the part we
# can finish today; optimizer integration remains a future release.
#
# Crate type is `staticlib + rlib` so the DuckDB build (a C++ binary)
# can link against the .a archive directly, and so other Rust crates
# (notably samkhya-bench's planned `--engine duckdb` path) can depend
# on this crate as a normal Rust library too.
# =====================================================================

[package]
name = "samkhya-duckdb-ext"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "C++ FFI scaffold linking samkhya's portable sketches into DuckDB; optimizer integration awaits DuckDB issue #11638"
readme = "README.md"
keywords = ["duckdb", "extension", "cardinality", "sketches", "cxx"]
categories = ["database"]

# staticlib  -> consumable from the DuckDB C++ build (.a archive).
# rlib       -> consumable from other workspace crates.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
samkhya-core.workspace = true
# cxx 1.0 provides the `#[cxx::bridge]` macro used in src/lib.rs.
cxx = "1.0"

[build-dependencies]
# cxx-build 1.0 generates the C++ side of the bridge and compiles
# src/wrapper.cc against it. The default build invokes this; the
# `no_cxx` feature disables it for environments without a C++
# toolchain (see build.rs and README).
cxx-build = "1.0"

[features]
default = []
# Escape hatch for environments that lack a C++ toolchain (minimal CI
# images, sandboxed `cargo check` runners). When enabled, build.rs
# becomes a no-op and the bridge module is excluded from compilation.
# The Rust API (HllHandle, puffin_inspect) remains visible but is not
# reachable from C++ in this configuration.
no_cxx = []
