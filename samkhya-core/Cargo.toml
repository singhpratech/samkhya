[package]
name = "samkhya-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "A provable join-cardinality ceiling, plus the portable sketches that feed it: HLL, Bloom, Count-Min, histograms, and Puffin sidecars"

[dependencies]
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
thiserror.workspace = true
byteorder.workspace = true
twox-hash.workspace = true
log.workspace = true
rusqlite = { workspace = true, optional = true }
zstd = { version = "0.13", optional = true }
gbdt = { version = "0.1", optional = true }
# Pure-Rust LP modelling crate. Disable defaults to drop the Coin-CBC
# backend (which requires a system C++ build); pick `microlp` so no
# system libraries are needed and the crate compiles cleanly on any
# Rust 1.94+ toolchain. Pulled in only behind the `lp_solver` feature.
good_lp = { version = "1.8", default-features = false, features = ["microlp"], optional = true }
# TabPFN HTTP transport (Layer 5 foundation-model interface). Pure-Rust
# blocking HTTP client; rustls-only by default so default builds never
# link OpenSSL. Opt-in via the `tabpfn_http` feature.
ureq = { version = "2", default-features = false, features = ["json", "tls"], optional = true }

[features]
default = ["feedback"]
# SQLite-backed feedback store. Requires libsqlite3, so it is the one part
# of the crate that cannot target wasm32 — hence the gate. Default-on, so
# an existing consumer is unaffected.
feedback = ["dep:rusqlite"]
zstd = ["dep:zstd"]
# Gradient-boosted-tree residual corrector backend (see src/residual.rs::gbt).
# Pulls in the `gbdt` crate; off by default to keep the core build slim.
gbt = ["dep:gbdt", "feedback"]
# Additive gradient-boosted-tree residual corrector backend
# (see src/residual.rs::additive). Predicts the absolute row count from
# plan-shape features instead of a multiplicative log-ratio, which keeps
# the corrector useful even when the baseline estimate collapses to zero.
additive_gbt = ["dep:gbdt", "feedback"]
# Real fractional-edge-cover LpBound (see src/lpbound.rs::LpJoinBound).
# Pulls in `good_lp` with the pure-Rust `microlp` backend. Off by default
# so the core crate stays slim; turn this on to replace the coarse
# Product/AGM/Chain bounds with the provable LP-derived ceiling.
lp_solver = ["dep:good_lp"]
# TabPFN-over-localhost-HTTP backend (see src/residual.rs::tabpfn).
# Pulls in `ureq` (pure-Rust, rustls-only) and uses workspace `serde_json`
# to POST `CorrectionFeatures` to a TabPFN inference server and parse
# back an `{"estimate": <u64>}` response. Off by default — the core build
# stays slim and the foundation-model interface is strictly opt-in.
tabpfn_http = ["dep:ureq"]
# Umbrella feature for the full TabPFN integration. Today this enables
# the HTTP transport; a future `tabpfn_subprocess` feature will join it
# under this umbrella so downstream users can request "TabPFN, however
# it's deployed" without picking a transport.
tabpfn = ["tabpfn_http"]
# LLM-pluggable corrector backend over localhost HTTP (see
# src/residual.rs::llm). Same wire contract as `tabpfn_http`; the server
# side picks an LLM provider (Anthropic / OpenAI / local Ollama / dummy)
# from an env var and returns the same `{"estimate": <u64>}` JSON. Pulls
# in `ureq` for the transport (shared with `tabpfn_http`; the dep is
# additive). Off by default — the LLM backend is strictly opt-in and is
# *not* the recommended production corrector (GBT v3 remains default).
llm_http = ["dep:ureq"]

[dev-dependencies]
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "sketches"
harness = false

[[bench]]
name = "puffin"
harness = false

# v0.9.0 hardening: stress benches that push HLL / Puffin / FeedbackStore
# an order of magnitude past the microbenches above. Run on release
# hardware; not part of the regression-tracking suite.
[[bench]]
name = "stress"
harness = false

# wasm32 support for the no-default-features surface (sketches, the degree
# ceiling, Puffin I/O). `getrandom` reaches wasm only with its `js` feature;
# it is a transitive dependency, so the feature has to be selected here.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
