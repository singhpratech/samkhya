[package]
name = "samkhya-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "A provable join-cardinality ceiling, and the portable sketches behind it, compiled to WebAssembly. 84 KB, TypeScript types included"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The feedback store is the one part of samkhya-core that cannot target
# wasm32 (it needs libsqlite3), so the default feature set is off. The LP
# solver is pure Rust and does compile, so the hypergraph bound comes along.
samkhya-core = { path = "../samkhya-core", version = "1.2.1", default-features = false, features = ["lp_solver"] }
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
