[package]
name = "samkhya-py"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Python bindings for samkhya via PyO3"
readme = "README.md"
keywords = ["python", "cardinality", "pyo3"]
categories = ["database"]

[lib]
# Compiled as `_native.so` and installed at `samkhya/_native.*.so` by
# maturin via the mixed Rust/Python layout (see pyproject.toml).
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
samkhya-core.workspace = true
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
serde = { workspace = true }
bincode = { workspace = true }
