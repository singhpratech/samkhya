[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "samkhya"
version = "1.2.2"
description = "A provable join-cardinality ceiling and portable statistics sketches, for query planning"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "Prateek Singh" },
]
keywords = [
    "cardinality",
    "sketches",
    "hyperloglog",
    "bloom-filter",
    "count-min-sketch",
    "histogram",
    "query-optimizer",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/singhpratech/samkhya"
Repository = "https://github.com/singhpratech/samkhya"
Issues = "https://github.com/singhpratech/samkhya/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
# Mixed Rust/Python layout: the Python package lives under `python/`
# and the compiled extension is installed as `samkhya._native`.
module-name = "samkhya._native"
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]
python-source = "python"
strip = true
