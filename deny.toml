# cargo-deny configuration for samkhya.
#
# Run locally:   cargo install --locked cargo-deny && cargo deny check
# Run in CI:     EmbarkStudios/cargo-deny-action@v2 (see .github/workflows/ci.yml).
#
# The four sections below correspond to cargo-deny's four checks:
#   * bans         — duplicate-version detection + per-crate disallows
#   * licenses     — SPDX allow/deny lists, applied to every transitive crate
#   * advisories   — RustSec advisory database lookups
#   * sources      — restricts which registries / git remotes are allowed
#
# Sole author: Prateek Singh. License: Apache-2.0.
#
# Note: every advisory ignore and bans skip must carry a comment explaining
# (a) where the dep comes in, (b) why the affected code path is unreachable,
# and (c) the upstream condition that retires the entry. No silent bypass.
# The 2026-05-17 rc.2 follow-up audit trimmed entries that no longer matched
# the current default-features graph; entries that fired with feature flags
# enabled (pgrx, polars, etc.) were retained and re-justified.

# ---------------------------------------------------------------------------
# graph — which target/cfg combinations to evaluate. Default `targets = []`
# means cargo-deny walks the host target only; that's the right behavior for
# samkhya since we only ship Linux/macOS x86_64 + aarch64 from CI and the
# duplicate-version analysis is most useful on the host target. Add targets
# here if a future release adds wasm32 or a cross-compiled embedded path.
# ---------------------------------------------------------------------------
[graph]
all-features = false
no-default-features = false

# ---------------------------------------------------------------------------
# advisories — RustSec database lookups. We keep `ignore = []` (no exempted
# advisories) so every release tag re-validates the whole transitive surface.
# If an advisory ever lands that cannot be addressed before a release, add the
# RUSTSEC-XXXX-NNNN id here with a comment explaining the embargo plan; do
# NOT silently bypass.
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Each ignored advisory MUST carry a comment explaining (a) which
# dependency pulls the affected crate in, (b) why the affected code
# path is not reachable from samkhya, and (c) the upstream condition
# that retires the ignore. No silent bypass.
#
# Retired in the 2026-05-17 rc.2 follow-up:
# - RUSTSEC-2021-0127 (serde_cbor unmaintained): only reachable under
#   the pg_extension feature; the dep is no longer present in the
#   default-feature graph. Re-add if a future build enables pg_extension.
# - RUSTSEC-2025-0003 (fast-float segfault on empty input): only
#   reachable via samkhya-polars under the relevant feature path; not
#   present in the default-feature graph. Re-add if a future build
#   enables the polars path without bumping to polars >= 0.45.
ignore = [
    # RUSTSEC-2024-0436 — paste 1.0.15 unmaintained. The author
    # archived the repository in 2024; v1.0.15 remains the final
    # release. Pulled in transitively by DataFusion 46
    # (datafusion-common). No samkhya code uses `paste!` directly.
    # Retires when DataFusion upstream migrates to `pastey` (the
    # community-maintained fork) or removes the dep entirely.
    "RUSTSEC-2024-0436",

    # RUSTSEC-2025-0141 — bincode 1.3.3 unmaintained. The bincode
    # team ceased development in 2025 after an off-platform incident;
    # they state v1.3.3 is a complete release that needs no further
    # updates ("the team considers version 1.3.3 a complete version
    # of bincode that is not in need of any updates"). samkhya uses
    # bincode 1.3.3 ONLY to (de)serialise its own sketch payload
    # bytes — payloads samkhya itself wrote and validates against
    # the Puffin KIND tag on read. No untrusted-input deserialization
    # path. Listed alternatives (postcard, rkyv, bitcode) are noted
    # for the v1.1 evaluation; for v1.0 the existing bincode wire
    # format is the published artifact stability guarantee.
    "RUSTSEC-2025-0141",
]

# ---------------------------------------------------------------------------
# licenses — standard Rust-ecosystem allowlist. Everything else is denied by
# default; cargo-deny refuses to build the workspace until an explicit entry
# is added. The list mirrors what the rustc / Servo / DataFusion projects
# accept: permissive licenses only, no copyleft.
#
# Note: samkhya itself is Apache-2.0 only (see Cargo.toml workspace.package
# and LICENSE-APACHE). The allow-list below is for *transitive* deps; many
# of them are MIT / BSD / etc. which is fine for redistribution under
# Apache-2.0 + the dep's own license preservation.
# ---------------------------------------------------------------------------
[licenses]
# `confidence-threshold` controls SPDX detection strictness. 0.8 is the
# project default and catches our existing LICENSE-APACHE-style files
# without false positives on standard MIT/BSD variants.
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # Unicode-DFS-2016 was historically pulled by older unicode-ident
    # / unicode-normalization crates; current transitive deps use
    # Unicode-3.0 instead. Removed in the 2026-05-17 rc.2 follow-up;
    # re-add if a future dep needs the older SPDX id.
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # CDLA-Permissive-2.0 — Community Data License Agreement, permissive
    # variant. OSI-recognised permissive license used by the rustls
    # webpki-roots crate (both 0.26.x and 1.0.x lines) for the Mozilla
    # root certificate bundle. It is a derivative-friendly license
    # equivalent in practice to MIT/Apache-2.0 for distribution. Added
    # here rather than as a per-crate exception because the entire
    # rustls TLS path depends on it; a per-crate exception would also
    # need to be duplicated whenever rustls bumps the webpki-roots
    # patch version. See https://cdla.dev/permissive-2-0/ for the text.
    "CDLA-Permissive-2.0",
    # BSL-1.0 — Boost Software License 1.0, permissive, OSI-approved.
    # Used by xxhash-rust 0.8.x (pulled transitively by polars-core
    # 0.44 for the rolling-hash builder). BSL-1.0 is functionally
    # equivalent to MIT/Apache for redistribution and is on the SPDX
    # standard license list. Retires when polars migrates xxhash-rust
    # off BSL or when xxhash-rust changes license (neither imminent).
    "BSL-1.0",
]
# Exceptions are *narrowed* allowlists for specific crates that ship under
# a license we otherwise consider case-by-case. Empty today; add entries
# here rather than widening `allow` above.
exceptions = []

# ---------------------------------------------------------------------------
# bans — duplicate-version control and per-crate disallows.
#
# Duplicate-version policy:
#
#   * `multiple-versions = "deny"` (tightened from the default warn) so the
#     workspace cannot quietly grow a fourth hashbrown version after a
#     sloppy upgrade.
#   * `skip` exempts crates where multiple versions are *unavoidable* — they
#     live deep in the dependency graph through crates we don't control
#     (rusqlite, datafusion, criterion, gbdt, etc.). Each skip is scoped
#     to a specific version so a new duplicate of the same crate re-trips
#     the deny.
#   * `skip-tree` is intentionally NOT used; we want every duplicate to be
#     justified individually rather than ignored wholesale through a
#     sub-tree.
#
# 2026-05-17 rc.2 follow-up trim:
#   The original list grew during the multi-engine integration cycle and
#   carried entries for arrow / parquet / brotli / flatbuffers / lz4_flex
#   / hashlink / half 1.8 / ordered-float / syn 1.0 / thiserror legacy /
#   pgrx ecosystem / darling / strum_macros / unicode-width 0.2 /
#   supports-color 3 / windows-sys 0.60 / etc. that no longer match the
#   current default-features graph (advisory-not-detected and
#   unnecessary-skip warnings from cargo deny). They were retired here;
#   if a future feature-flag combination re-pulls them, re-add the entry
#   with the same rationale-line convention.
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "deny"
wildcards = "deny"
# `highlight = "all"` makes the duplicate-version report show every path to
# every duplicated crate, which is what an operator needs to decide whether
# a new duplicate is upstream-unavoidable or our own sloppiness.
highlight = "all"
# Crates we never want pulled in transitively. Empty today; populated if a
# future audit flags one of the openssl-sys families (we use rustls-only
# paths throughout) or a known-yanked crate.
deny = []
# Known-transitive duplicates currently present under default features.
# Each entry should have a one-line comment explaining *why* the duplicate
# exists; if upstream consolidates, remove the skip in the same PR.
skip = [
    # --- bitflags ---
    # bitflags — legacy 1.3 still rooted in clap-2 / rusqlite ffi; we use
    # the modern 2.x line directly.
    { name = "bitflags", version = "1.3" },

    # --- hashbrown — four lines, all transitive ---
    # No samkhya code constructs a hashbrown map directly; every version
    # below arrives through a dependency we do not control. Paths verified
    # with `cargo tree -i hashbrown@<v> --target all` on 2026-07-25:
    #   0.14 → dashmap 6 → datafusion-catalog 46
    #   0.15 → arrow-array 54 → arrow → datafusion 46
    #   0.16 → hashlink 0.11 → rusqlite 0.39 (samkhya-core `feedback`)
    #   0.17 → indexmap 2.14 → arrow-json 54  (the version we converge on)
    # Retires when DataFusion rebases dashmap/arrow onto 0.17 and rusqlite
    # picks up a hashlink that does the same.
    { name = "hashbrown", version = "0.14" },
    { name = "hashbrown", version = "0.15" },
    { name = "hashbrown", version = "0.16" },

    # --- getrandom — three lines ---
    # getrandom 0.2 → rand 0.8 (samkhya-core's deterministic Bloom
    # seeds). getrandom 0.3 / 0.4 → newer rand and async-runtime
    # paths. Transitive churn; consolidation requires every upstream
    # user to migrate. Retires when DataFusion / Polars rebase to rand 0.9.
    { name = "getrandom", version = "0.2" },
    { name = "getrandom", version = "0.3" },

    # --- windows-sys (CI not currently running Windows) ---
    # windows-sys 0.52 — only matters when CI runs on Windows
    # (currently disabled); kept here so a future Windows job doesn't
    # immediately trip the duplicate rule.
    { name = "windows-sys", version = "0.52" },

    # --- wit-bindgen — wasm-component dep paths ---
    # Two versions exist (0.51 via wasip3 → getrandom 0.4 → tempfile;
    # 0.57 via the other getrandom path). Only matters if we ever
    # enable a wasm target. Forward-looking parity with windows-sys.
    { name = "wit-bindgen", version = "0.51" },
    { name = "wit-bindgen", version = "0.57" },

    # --- cpufeatures (SIMD detection — two getrandom paths) ---
    # cpufeatures 0.2 via rand_chacha-old; cpufeatures 0.3 via the
    # modern direct user. Transitive only; no samkhya code calls
    # cpufeatures directly. Retires when the older rand_chacha 0.3
    # arm drops out of the graph.
    { name = "cpufeatures", version = "0.2" },

    # --- itertools (datafusion + gbdt) ---
    # itertools 0.13 — datafusion 46 + gbdt 0.1; itertools 0.14 —
    # newer transitives. samkhya does not depend on itertools directly.
    { name = "itertools", version = "0.13" },

    # --- r-efi (getrandom UEFI support — two getrandom paths) ---
    # r-efi 5.3 via getrandom 0.2; r-efi 6.0 via getrandom 0.3 / 0.4.
    # Retires with the getrandom consolidation above.
    { name = "r-efi", version = "5.3.0" },

    # --- syn (proc-macro expansion — serde/thiserror moved first) ---
    # syn 3.0 shipped 2026-07; the derive ecosystem is mid-migration.
    # Paths verified with `cargo tree -i syn@<v> --workspace` on 2026-08-01:
    #   3.0 → serde_derive 1.0.229, thiserror-impl 2.0.19  (2 roots)
    #   2.0 → the other 18 derive crates (arrow, datafusion-macros, pyo3,
    #         tokio, clap, wasm-bindgen, cxx, …)             (the majority)
    # Every root on both lines is a proc-macro or build-script crate, so
    # neither version links into a shipped artifact; the cost is compile
    # time. Retires when the 2.0 side of that list empties out — check by
    # dropping this entry, not by waiting for a notification.
    { name = "syn", version = "2.0" },

    # --- twox-hash (both versions arrive through DataFusion 46) ---
    # Corrected 2026-08-01: this entry used to claim samkhya-core pinned
    # 1.6 and DataFusion pulled 2.x. Both versions are in fact rooted in
    # DataFusion 46 — parquet 54.3.1 → 1.6.3, lz4_flex 0.11 → 2.1.2 — and
    # samkhya-core's own pin was the 1.6 that made it look like ours.
    # samkhya-core now takes 2.1 (digest-identical; XXH64 is spec-fixed),
    # so this skip covers upstream only. Retires when parquet drops its
    # 1.6 dependency, which the DataFusion 54 bump may already do.
    { name = "twox-hash", version = "1.6" },
]
skip-tree = []

# ---------------------------------------------------------------------------
# sources — restricts crate origins. `unknown-registry = "deny"` means every
# crate must come from crates.io (or a registry explicitly whitelisted
# below); `unknown-git = "deny"` means no `git = "https://..."` deps without
# an explicit allow. Both are critical for supply-chain hygiene at the
# pre-1.0 hardening tier.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
