name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `rust-toolchain.toml` at the repo root pins the channel (1.94)
      # and components (rustfmt, clippy). We still specify `stable` here
      # so the action installs the modern launcher; the toolchain file
      # takes precedence when invoking cargo from the workspace root.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry, index, and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # We exclude two members from the workspace lint/test pass:
      #   * samkhya-duckdb — links against DuckDB's C++ via `cxx`; requires
      #     a configured C++ toolchain and DuckDB headers that are not
      #     installed on stock `ubuntu-latest` runners.
      #   * samkhya-py — PyO3 extension module; needs the matching Python
      #     dev headers and is built end-to-end by `maturin` in a separate
      #     job (see `build-py` below, currently disabled).
      - name: Clippy (workspace, deny warnings)
        run: cargo clippy --workspace --exclude samkhya-duckdb --exclude samkhya-py -- -D warnings

      - name: Test (workspace)
        run: cargo test --workspace --exclude samkhya-duckdb --exclude samkhya-py

  # ---------------------------------------------------------------------------
  # cargo-deny — supply-chain hygiene. Runs the four checks (bans /
  # licenses / advisories / sources) configured in `deny.toml` at the
  # repository root. Lands as part of v0.9.0 per ROADMAP §7.
  #
  # Fuzzing is NOT enabled in CI: cargo-fuzz requires a nightly toolchain
  # and a long-running budget that's incompatible with per-PR feedback.
  # Fuzz targets live in `samkhya-core/fuzz/` (a standalone workspace) and
  # are run locally before each release tag.
  # ---------------------------------------------------------------------------
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Default `command = "check"` runs all four checks: bans,
          # licenses, advisories, sources.
          command: check
          # `arguments: --workspace` aligns with the v1.0.0 pre-flight
          # verification (default features). cargo-deny-action's default
          # is --all-features which activates samkhya-postgres's pgrx 0.12
          # path (pulling unmaintained serde_cbor via RUSTSEC-2021-0127)
          # and produces ~60 duplicate-version bans from
          # arrow/brotli/hashbrown/rand co-activation across pgrx +
          # polars-all-features + iceberg + duckdb. Retire this argument
          # override when (a) pgrx ≥ 0.13 lands and drops serde_cbor, and
          # (b) we have a strategy for the cross-engine arrow / hashbrown
          # version sprawl under all-features.
          arguments: --workspace

  # ---------------------------------------------------------------------------
  # Python wheel build — disabled until the PyO3 surface stabilises and we
  # decide on a wheel-distribution channel. When re-enabling, this job should
  # run maturin on a matrix of {linux, macos, windows} x {3.9..3.12} and
  # publish artifacts.
