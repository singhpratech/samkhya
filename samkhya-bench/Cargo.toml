[package]
name = "samkhya-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Benchmark harness for samkhya: JOB-Slow, TPC-H, STATS-CEB"
keywords = ["benchmark", "cardinality", "query-optimizer"]
categories = ["database"]
publish = false

[dependencies]
samkhya-core = { workspace = true, features = ["gbt", "additive_gbt"] }
samkhya-datafusion = { path = "../samkhya-datafusion", version = "1.0" }
clap.workspace = true
tokio.workspace = true
datafusion = "46"
rand = "0.8"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Used only by the `ablation_runner` binary's L4-v2 retrain path
# (Wave-4 closing). The crate is already pulled in transitively by
# samkhya-core's `gbt` feature; declaring it explicitly here lets the
# binary call the gbdt API directly without going through samkhya-core's
# `GbtCorrector::train` (which hardcodes `baseline_estimate`-only
# features). Additive — does not affect any other binary.
gbdt = "0.1"
