[package]
name = "samkhya-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Benchmark harness for samkhya: JOB-Slow, TPC-H, STATS-CEB, and corrector train/evaluate flows"
keywords = ["benchmark", "cardinality", "query-optimizer"]
categories = ["database"]
publish = false

[dependencies]
samkhya-core = { workspace = true, features = ["gbt", "additive_gbt"] }
samkhya-datafusion = { path = "../samkhya-datafusion", version = "1.2.3" }
clap.workspace = true
tokio.workspace = true
datafusion = "46"
rand = "0.8"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Used only by the `ablation_runner` binary's L4-v2 retrain path
# (Wave-4 closing). The crate is already pulled in transitively by
# samkhya-core's `gbt` feature; declaring it explicitly here lets the
# binary call the gbdt API directly without going through samkhya-core's
# `GbtCorrector::train` (which hardcodes `baseline_estimate`-only
# features). Additive — does not affect any other binary.
gbdt = "0.1"
# WAVE-5M: cold-cache eviction via posix_fadvise(POSIX_FADV_DONTNEED).
# libc is already transitively in tree (datafusion → arrow → ...); the
# explicit dep here makes the cold_cache module's unsafe FFI call
# auditable. Unix-gated at use site.
libc = "0.2"
# WAVE-5L: tabpfn_latency client (file 14). Pure-Rust rustls HTTP client,
# matches the transport used by samkhya-core::residual::tabpfn so the
# wire-level overhead is comparable to production. Only the bin needs
# this; library code is unchanged.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[dev-dependencies]
# Used by the cold_cache unit test to create a 100 MiB synthetic
# parquet-shaped file in a self-cleaning temp directory.
tempfile = "3"

[features]
# Enables the end-to-end train -> freeze -> reload test, which fits a real
# model and is therefore slower than the rest of the suite.
gbt-flow = []
